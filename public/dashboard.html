<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Comando — Agente IA</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    body { height: auto; min-height: 100vh; }
    .painel { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; }
    .painel-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .painel-topo h1 { margin: 0; font-size: 1.4rem; color: var(--acento); }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .cartao { background: var(--tinta-clara); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 18px; }
    .cartao .rotulo { color: var(--texto-fraco); font-size: 0.8rem; }
    .cartao .valor { font-size: 1.8rem; font-weight: 700; margin-top: 4px; }
    .grafico { background: var(--tinta-clara); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .grafico h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 600; }
    .grafico .area { position: relative; height: 280px; }
    .aviso { background: rgba(248, 113, 113, 0.1); border: 1px solid var(--vermelho); color: var(--vermelho);
             border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; }
    a.btn-secundario { text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <div class="painel">
    <div class="painel-topo">
      <h1>📊 Centro de Comando</h1>
      <div>
        <span id="ao-vivo" class="sala-conexao">Tempo real: conectando...</span>
        <a href="index.html" class="btn-secundario">← Voltar ao chat</a>
      </div>
    </div>

    <div id="aviso" class="aviso escondido"></div>

    <section class="cartoes">
      <div class="cartao"><div class="rotulo">Tokens gastos (total)</div><div class="valor" id="kpi-tokens">–</div></div>
      <div class="cartao"><div class="rotulo">Mensagens no banco</div><div class="valor" id="kpi-mensagens">–</div></div>
      <div class="cartao"><div class="rotulo">Usuários cadastrados</div><div class="valor" id="kpi-usuarios">–</div></div>
    </section>

    <section class="grafico">
      <h2>Tokens por dia (últimos 14 dias)</h2>
      <div class="area"><canvas id="graficoTokens"></canvas></div>
    </section>

    <section class="grafico">
      <h2>Mensagens por dia (últimos 14 dias)</h2>
      <div class="area"><canvas id="graficoMensagens"></canvas></div>
    </section>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
